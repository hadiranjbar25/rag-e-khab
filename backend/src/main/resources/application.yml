server:
  port: ${SERVER_PORT:8060}

spring:
  application:
    name: rag-e-khab
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ragekhab}
    username: ${SPRING_DATASOURCE_USERNAME:ragekhab}
    password: ${SPRING_DATASOURCE_PASSWORD:ragekhab}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ragekhab:
  llm:
    provider: ${RAGEKHAB_LLM_PROVIDER:ollama}
    model: ${RAGEKHAB_LLM_MODEL:llama3.1}
    api-key: ${RAGEKHAB_LLM_API_KEY:}
    base-url: ${RAGEKHAB_LLM_BASE_URL:http://localhost:11434}
  optimizer:
    mode: ${RAGEKHAB_OPTIMIZER_MODE:retrieval}
    max-tokens: ${RAGEKHAB_OPTIMIZER_MAX_TOKENS:3000}
  local-llm:
    enabled: ${RAGEKHAB_LOCAL_LLM_ENABLED:false}
    provider: ${RAGEKHAB_LOCAL_LLM_PROVIDER:ollama}
    base-url: ${RAGEKHAB_LOCAL_LLM_BASE_URL:http://localhost:11434}
    model: ${RAGEKHAB_LOCAL_LLM_MODEL:qwen2.5:7b}
  embedding:
    provider: ${RAGEKHAB_EMBEDDING_PROVIDER:hash}
    model: ${RAGEKHAB_EMBEDDING_MODEL:nomic-embed-text}
    base-url: ${RAGEKHAB_EMBEDDING_BASE_URL:http://host.docker.internal:11434}
    dimensions: ${RAGEKHAB_EMBEDDING_DIMENSIONS:384}
  qdrant:
    url: ${QDRANT_URL:http://localhost:6333}
    collection: ${QDRANT_COLLECTION:ragekhab_documents}
  repository-agent:
    path: ${RAGEKHAB_REPOSITORY_PATH:}
    scheduled: ${RAGEKHAB_REPOSITORY_SCHEDULED:false}
    interval-ms: ${RAGEKHAB_REPOSITORY_SCAN_INTERVAL_MS:300000}
