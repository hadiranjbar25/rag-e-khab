services:
  postgres:
    image: postgres:16-alpine
    networks:
      default:
        aliases:
          - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragekhab}
      POSTGRES_USER: ${POSTGRES_USER:-ragekhab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragekhab}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      SERVER_PORT: 8060
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-ragekhab}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ragekhab}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ragekhab}
      QDRANT_URL: http://qdrant:6333
      RAGEKHAB_LLM_PROVIDER: ${RAGEKHAB_LLM_PROVIDER:-ollama}
      RAGEKHAB_LLM_MODEL: ${RAGEKHAB_LLM_MODEL:-llama3.1}
      RAGEKHAB_LLM_BASE_URL: ${RAGEKHAB_LLM_BASE_URL:-http://host.docker.internal:11434}
      RAGEKHAB_LLM_API_KEY: ${RAGEKHAB_LLM_API_KEY:-}
      RAGEKHAB_OPTIMIZER_MODE: ${RAGEKHAB_OPTIMIZER_MODE:-retrieval}
      RAGEKHAB_OPTIMIZER_MAX_TOKENS: ${RAGEKHAB_OPTIMIZER_MAX_TOKENS:-3000}
      RAGEKHAB_LOCAL_LLM_ENABLED: ${RAGEKHAB_LOCAL_LLM_ENABLED:-false}
      RAGEKHAB_LOCAL_LLM_PROVIDER: ${RAGEKHAB_LOCAL_LLM_PROVIDER:-ollama}
      RAGEKHAB_LOCAL_LLM_BASE_URL: ${RAGEKHAB_LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434}
      RAGEKHAB_LOCAL_LLM_MODEL: ${RAGEKHAB_LOCAL_LLM_MODEL:-qwen2.5:7b}
      RAGEKHAB_REPOSITORY_PATH: ${RAGEKHAB_REPOSITORY_PATH:-}
      RAGEKHAB_REPOSITORY_SCHEDULED: ${RAGEKHAB_REPOSITORY_SCHEDULED:-false}
      RAGEKHAB_REPOSITORY_SCAN_INTERVAL_MS: ${RAGEKHAB_REPOSITORY_SCAN_INTERVAL_MS:-300000}
    ports:
      - "8060:8060"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8060/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
