services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      SERVER_PORT: 8080
      QDRANT_URL: http://qdrant:6333
      RAGEKHAB_STORAGE_DIR: /app/data/documents
      RAGEKHAB_LLM_PROVIDER: ${RAGEKHAB_LLM_PROVIDER:-ollama}
      RAGEKHAB_LLM_MODEL: ${RAGEKHAB_LLM_MODEL:-llama3.1}
      RAGEKHAB_LLM_BASE_URL: ${RAGEKHAB_LLM_BASE_URL:-http://host.docker.internal:11434}
      RAGEKHAB_LLM_API_KEY: ${RAGEKHAB_LLM_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      - qdrant
    volumes:
      - document_data:/app/data/documents

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  qdrant_data:
  document_data:
