server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_intercept_errors on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_pass http://backend:8080/api/;
  }

  location /mcp {
    proxy_intercept_errors on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_pass http://backend:8080/mcp;
  }

  error_page 502 503 504 = @backend_unavailable;

  location @backend_unavailable {
    default_type application/json;
    return 503 '{"error":"Backend service is unavailable. Check the backend container logs and health status."}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
